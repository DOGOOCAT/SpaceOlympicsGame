<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE OLYMPICS 🇮🇱</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #08051c;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: monospace;
}

.game-wrap {
    width: min(100vw, 1024px);
    position: relative;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    border: 2px solid #33206b;
    box-shadow: 0 0 35px #6c21c9;
    touch-action: none;
}

.controls {
    position: absolute;
    bottom: 15px;
    left: 15px;
    display: flex;
    gap: 8px;
}

.controls button {
    width: 48px;
    height: 48px;
    border: 2px solid #a86cff;
    background: #35105eaa;
    color: white;
    border-radius: 10px;
    font-size: 22px;
    touch-action: none;
}
</style>
</head>

<body>

<div class="game-wrap">
<canvas id="game" width="1024" height="432"></canvas>

<div class="controls">
    <button data-key="ArrowLeft">◀</button>
    <button data-key="ArrowUp">▲</button>
    <button data-key="ArrowDown">▼</button>
    <button data-key="ArrowRight">▶</button>
</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 1024;
const H = 432;

ctx.imageSmoothingEnabled = false;

const keys = {};
let player;
let crystals = [];
let enemies = [];
let particles = [];
let stars = [];
let comets = [];

let score = 0;
let coins = 999;
let lives = 3;
let level = 2;
let progress = 0;
let gameOver = false;
let frame = 0;
let shake = 0;
let invincible = 0;

const rand = (a,b) => Math.random()*(b-a)+a;

function polygon(points, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for(let i=1;i<points.length;i++)
        ctx.lineTo(points[i][0],points[i][1]);
    ctx.closePath();
    ctx.fill();
}

function rect(x,y,w,h,color) {
    ctx.fillStyle=color;
    ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function glow(x,y,r,color) {
    ctx.save();
    ctx.shadowBlur=r;
    ctx.shadowColor=color;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(x,y,r/4,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
}

// Stars
function createStars() {
    stars=[];
    for(let i=0;i<130;i++){
        stars.push({
            x:rand(0,W),
            y:rand(0,H),
            size:rand(1,3),
            speed:rand(.15,1),
            phase:rand(0,7)
        });
    }
}

// Player
function createPlayer() {
    return {
        x:450,
        y:330,
        w:60,
        h:75,
        speed:4,
        tilt:0
    };
}

function resetGame() {
    score=0;
    lives=3;
    coins=999;
    level=2;
    progress=0;
    gameOver=false;
    shake=0;
    invincible=0;

    player=createPlayer();
    crystals=[];
    enemies=[];
    particles=[];
    comets=[];

    for(let i=0;i<5;i++) spawnCrystal();
    for(let i=0;i<3;i++) spawnEnemy();
}

function spawnCrystal() {
    crystals.push({
        x:rand(40,W-40),
        y:rand(55,300),
        size:25,
        phase:rand(0,10),
        speed:rand(1.5,2.5)
    });
}

function spawnEnemy() {
    enemies.push({
        x:rand(50,W-50),
        y:rand(65,270),
        type:Math.floor(rand(0,3)),
        phase:rand(0,10),
        speed:rand(.4,1.1),
        size:55
    });
}

// Keyboard
document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))
        e.preventDefault();

    if(gameOver && e.key.toLowerCase()==="r") resetGame();
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

// Mobile controls
document.querySelectorAll(".controls button").forEach(btn=>{
    const key=btn.dataset.key.toLowerCase();

    btn.addEventListener("pointerdown",e=>{
        e.preventDefault();
        keys[key]=true;
        btn.setPointerCapture(e.pointerId);
    });

    const release=()=>{
        keys[key]=false;
    };

    btn.addEventListener("pointerup",release);
    btn.addEventListener("pointercancel",release);
    btn.addEventListener("lostpointercapture",release);
});

function distance(a,b) {
    return Math.hypot(a.x-b.x,a.y-b.y);
}

// Particle explosion
function explosion(x,y,color,count=18) {
    for(let i=0;i<count;i++){
        let angle=rand(0,Math.PI*2);
        let speed=rand(1,5);

        particles.push({
            x,y,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,
            life:rand(15,35),
            color,
            size:rand(2,5)
        });
    }
}

// Background
function drawBackground() {
    let gradient=ctx.createLinearGradient(0,0,0,H);
    gradient.addColorStop(0,"#100b35");
    gradient.addColorStop(.55,"#421077");
    gradient.addColorStop(1,"#721a91");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    // Galaxy clouds
    for(let i=0;i<5;i++){
        ctx.fillStyle="rgba(119,38,194,.07)";
        ctx.beginPath();
        ctx.arc(
            100+i*230+Math.sin(frame*.006+i)*30,
            170+Math.cos(frame*.008+i)*50,
            100+i*8,0,Math.PI*2
        );
        ctx.fill();
    }

    // Stars
    stars.forEach(s=>{
        let brightness=.4+Math.sin(frame*.06+s.phase)*.5;

        ctx.globalAlpha=brightness;
        rect(s.x,s.y,s.size,s.size,"#ffffff");

        if(frame%3===0) s.x-=s.speed;

        if(s.x<0){
            s.x=W;
            s.y=rand(0,H);
        }
    });

    ctx.globalAlpha=1;

    // Distant shooting stars
    if(Math.random()<.012){
        comets.push({
            x:W,
            y:rand(20,260),
            life:40
        });
    }

    comets.forEach(c=>{
        ctx.strokeStyle="#8ceaff";
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(c.x,c.y);
        ctx.lineTo(c.x+20,c.y-8);
        ctx.stroke();

        c.x-=7;
        c.life--;
    });

    comets=comets.filter(c=>c.life>0);

    // Purple sparkling stars
    drawSparkle(720,125,16,"#d64dff");
    drawSparkle(965,195,17,"#ff315d");
    drawSparkle(954,312,20,"#00cfff");
    drawSparkle(643,373,15,"#ffe32d");
    drawSparkle(265,347,18,"#ff8b60");

    // Alien planet ground
    polygon([
        [0,432],[0,425],[12,428],[25,421],[39,428],
        [55,427],[70,434],[88,425],[105,431],
        [125,422],[140,428],[157,419],[177,430],
        [197,426],[215,434],[240,426],[260,431],
        [280,424],[300,431],[320,426],[345,432],
        [365,423],[380,431],[400,426],[420,433],
        [440,423],[460,430],[480,426],[500,433],
        [520,426],[540,432],[560,420],[580,430],
        [600,426],[620,435],[640,422],[660,430],
        [680,424],[700,432],[720,420],[740,430],
        [760,425],[780,434],[800,420],[820,430],
        [840,424],[860,431],[880,421],[900,430],
        [920,423],[940,431],[960,419],[980,429],
        [1000,418],[1024,428],[1024,432]
    ],"#d66b52");

    rect(0,431,W,2,"#ffad6d");
}

function drawSparkle(x,y,size,color) {
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle=color;
    polygon([
        [0,-size],[size*.35,-size*.35],
        [size,0],[size*.35,size*.35],
        [0,size],[-size*.35,size*.35],
        [-size,0],[-size*.35,-size*.35]
    ],color);
    ctx.restore();
}

// Hearts
function drawHeart(x,y,size,color) {
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(size/30,size/30);

    polygon([
        [-14,-5],[-14,-12],[-7,-17],
        [0,-10],[7,-17],[14,-12],
        [14,-5],[0,12]
    ],color);

    ctx.restore();
}

function drawHUD() {
    // Hearts
    for(let i=0;i<3;i++){
        let active=i<lives;
        let pulse=active?Math.sin(frame*.1+i)*1.5:0;

        drawHeart(50+i*70,40+pulse,48,
            active?"#ff398b":"#642b70");
    }

    // Level
    ctx.fillStyle="white";
    ctx.font="bold 30px monospace";
    ctx.fillText("LVL "+level,362,50);

    // Progress bar
    rect(465,26,187,27,"#163c92");
    rect(470,31,177,17,"#080e3d");
    rect(474,35,Math.max(0,progress/100*169),9,"#00d8ff");
    rect(474,35,progress/100*169,3,"#9bfaff");

    // Coins
    ctx.fillStyle="#fff000";
    ctx.font="bold 27px monospace";
    ctx.fillText(coins,907,49);

    glow(985,39,19,"#ffdc00");

    ctx.fillStyle="#ffd000";
    ctx.beginPath();
    ctx.arc(985,39,13,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fff27b";
    ctx.fillRect(981,30,5,17);
    ctx.fillRect(978,35,12,5);
}

// Spaceship
function drawPlayer() {
    if(invincible>0 && Math.floor(frame/4)%2===0) return;

    let x=player.x;
    let y=player.y;

    let flame=Math.sin(frame*.35)*6;

    // Engine flames
    polygon([
        [x+18,y+42],
        [x+24,y+68+flame],
        [x+31,y+49]
    ],"#ff347b");

    polygon([
        [x+38,y+42],
        [x+46,y+68-flame],
        [x+49,y+43]
    ],"#ff5d2d");

    polygon([
        [x+27,y+47],
        [x+34,y+64+flame],
        [x+41,y+47]
    ],"#ffd62c");

    // Wings
    polygon([
        [x+30,y],
        [x-10,y+44],
        [x+22,y+36],
        [x+30,y+50],
        [x+40,y+36],
        [x+75,y+44]
    ],"#a9caff");

    // Main body
    polygon([
        [x+30,y-12],
        [x+44,y+24],
        [x+39,y+50],
        [x+30,y+62],
        [x+21,y+50],
        [x+16,y+24]
    ],"#b3d9ff");

    polygon([
        [x+30,y-12],
        [x+35,y+25],
        [x+30,y+62],
        [x+25,y+25]
    ],"#667fda");

    // Cockpit
    polygon([
        [x+30,y+3],
        [x+39,y+28],
        [x+30,y+39],
        [x+21,y+28]
    ],"#ff4c9b");

    rect(x+26,y+17,8,8,"#ffe3ff");
    rect(x+29,y+20,3,3,"#ffffff");

    // Details
    rect(x+7,y+42,8,5,"#ffdd4b");
    rect(x+50,y+42,8,5,"#ffdd4b");
}

// Animated aliens
function drawAlien(e) {
    let x=e.x;
    let y=e.y+Math.sin(frame*.06+e.phase)*7;
    let bob=Math.sin(frame*.12+e.phase)*3;

    let color=["#00cfff","#9ee600","#ff456e"][e.type];

    ctx.save();

    // Tentacles for green alien
    if(e.type===1){
        for(let i=0;i<5;i++){
            let tx=x-18+i*9;
            let wave=Math.sin(frame*.13+i+e.phase)*5;

            ctx.strokeStyle="#a1e900";
            ctx.lineWidth=4;
            ctx.beginPath();
            ctx.moveTo(tx,y+25);
            ctx.lineTo(tx+wave,y+38+Math.sin(frame*.1+i)*5);
            ctx.stroke();
        }
    }

    // Shadow
    ctx.fillStyle="rgba(0,0,0,.25)";
    ctx.beginPath();
    ctx.ellipse(x,y+34,30,7,0,0,Math.PI*2);
    ctx.fill();

    // UFO shell
    ctx.fillStyle="#aaa3d5";
    ctx.beginPath();
    ctx.ellipse(x,y+16,34,19,0,0,Math.PI*2);
    ctx.fill();

    // Dome
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(x,y+1+bob,26,Math.PI,Math.PI*2);
    ctx.lineTo(x+25,y+13);
    ctx.lineTo(x-25,y+13);
    ctx.closePath();
    ctx.fill();

    // Dome highlights
    rect(x-18,y-13+bob,8,4,"#e7f6ff");
    rect(x+10,y-16+bob,7,4,"#e7f6ff");

    // Big eye
    ctx.fillStyle="#ffffff";
    ctx.beginPath();
    ctx.ellipse(x,y+2+bob,12,13,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#10225c";
    ctx.beginPath();
    ctx.arc(x,y+3+bob,6,0,Math.PI*2);
    ctx.fill();

    rect(x-3,y+bob,4,4,"#ffffff");

    // UFO bottom
    rect(x-23,y+17,46,5,"#a8a1ce");

    for(let i=0;i<4;i++){
        glow(x-17+i*11,y+23,8,color);
    }

    ctx.restore();
}

// Crystal
function drawCrystal(c) {
    let y=c.y+Math.sin(frame*.09+c.phase)*7;
    let rotation=Math.sin(frame*.06+c.phase)*3;

    ctx.save();
    ctx.translate(c.x,y);
    ctx.rotate(rotation*.03);

    ctx.shadowBlur=18;
    ctx.shadowColor="#c18aff";

    polygon([
        [0,-23],[20,-4],[12,16],
        [0,25],[-13,15],[-20,-4]
    ],"#9b83da");

    polygon([
        [0,-23],[0,18],[-13,15],[-20,-4]
    ],"#d8c5ff");

    polygon([
        [0,-23],[20,-4],[12,16],[0,18]
    ],"#8c6bc5");

    polygon([
        [0,-13],[9,-3],[0,8],[-9,-3]
    ],"#eee5ff");

    ctx.restore();
}

// Collectible particles
function updateParticles() {
    particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=.04;
        p.life--;

        ctx.globalAlpha=Math.max(0,p.life/35);
        rect(p.x,p.y,p.size,p.size,p.color);
    });

    ctx.globalAlpha=1;
    particles=particles.filter(p=>p.life>0);
}

// Collision
function update() {
    frame++;

    if(gameOver) return;

    // Player movement
    let dx=0,dy=0;

    if(keys["arrowleft"]||keys["a"]) dx--;
    if(keys["arrowright"]||keys["d"]) dx++;
    if(keys["arrowup"]||keys["w"]) dy--;
    if(keys["arrowdown"]||keys["s"]) dy++;

    if(dx||dy){
        const len=Math.hypot(dx,dy);
        player.x+=dx/len*player.speed;
        player.y+=dy/len*player.speed;
    }

    player.x=Math.max(25,Math.min(W-90,player.x));
    player.y=Math.max(100,Math.min(H-110,player.y));

    if(invincible>0) invincible--;

    // Crystals
    crystals.forEach((c,i)=>{
        c.x-=c.speed;

        if(distance(
            {x:player.x+30,y:player.y+30},
            {x:c.x,y:c.y}
        )<34){
            score+=10;
            coins++;
            progress+=10;

            if(progress>=100){
                progress=0;
                level++;
            }

            explosion(c.x,c.y,"#d9a2ff",20);
            crystals.splice(i,1);
            crystals.push({
                x:W+rand(30,250),
                y:rand(60,310),
                size:25,
                phase:rand(0,10),
                speed:rand(1.5,2.5)
            });
        }
        else if(c.x<-30){
            c.x=W+rand(30,200);
            c.y=rand(60,310);
        }
    });

    // Enemies
    enemies.forEach((e,i)=>{
        e.x+=Math.sin(frame*.018+e.phase)*e.speed;
        e.y+=Math.cos(frame*.025+e.phase)*.6;

        if(distance(
            {x:player.x+30,y:player.y+30},
            {x:e.x,y:e.y}
        )<44 && invincible===0){

            lives--;
            invincible=100;
            shake=12;

            explosion(player.x+30,player.y+30,"#ff398b",30);

            e.x=rand(100,W-100);
            e.y=rand(60,260);

            if(lives<=0) gameOver=true;
        }
    });

    // Occasionally spawn more enemies
    if(frame%600===0){
        spawnEnemy();
    }

    updateParticles();

    if(shake>0) shake*=.8;
}

// Game drawing
function draw() {
    ctx.save();

    if(shake>1){
        ctx.translate(rand(-shake,shake),rand(-shake,shake));
    }

    drawBackground();

    crystals.forEach(drawCrystal);
    enemies.forEach(drawAlien);

    drawPlayer();

    updateParticles();

    // Floating score message
    if(frame%200<60){
        ctx.fillStyle="#ffffff";
        ctx.font="bold 22px monospace";
        ctx.fillText("+10pt",445,236);
    }

    drawHUD();

    // Score display
    ctx.fillStyle="#ffffff";
    ctx.font="bold 17px monospace";
    ctx.fillText("SCORE "+score,18,105);

    // Game over
    if(gameOver){
        ctx.fillStyle="rgba(9,3,30,.85)";
        ctx.fillRect(0,0,W,H);

        ctx.textAlign="center";

        ctx.shadowBlur=20;
        ctx.shadowColor="#ff258e";

        ctx.fillStyle="#ff60bc";
        ctx.font="bold 58px monospace";
        ctx.fillText("GAME OVER",W/2,175);

        ctx.shadowBlur=0;
        ctx.fillStyle="white";
        ctx.font="bold 25px monospace";
        ctx.fillText("FINAL SCORE: "+score,W/2,230);

        ctx.fillStyle="#ffe22d";
        ctx.font="bold 20px monospace";
        ctx.fillText("PRESS R TO PLAY AGAIN",W/2,290);

        ctx.textAlign="left";
    }

    ctx.restore();
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

createStars();
resetGame();
gameLoop();

</script>
</body>
</html>
