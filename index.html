<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE OLYMPICS 🇮🇱</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #08051c;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: monospace;
}

.game-wrap {
    width: min(100vw, 1024px);
    position: relative;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    border: 2px solid #33206b;
    box-shadow: 0 0 35px #6c21c9;
    touch-action: none;
    cursor: crosshair;
}

.controls {
    position: absolute;
    bottom: 15px;
    left: 15px;
    display: flex;
    gap: 8px;
}

.controls button {
    width: 48px;
    height: 48px;
    border: 2px solid #a86cff;
    background: #35105eaa;
    color: white;
    border-radius: 10px;
    font-size: 22px;
    touch-action: none;
}

.lang-box {
    position: absolute;
    bottom: 15px;
    right: 15px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #d9c4ff;
    font-size: 13px;
}

.lang-box select {
    background: #35105eee;
    color: white;
    border: 2px solid #a86cff;
    border-radius: 10px;
    padding: 6px 8px;
    font-family: monospace;
    font-size: 15px;
}

.overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: white;
    text-align: center;
    background: rgba(9,3,30,.55);
    border: 2px solid transparent;
}
.hidden { display: none !important; }

.title {
    font-size: clamp(26px, 6vw, 56px);
    font-weight: bold;
    color: #ff60bc;
    text-shadow: 0 0 20px #ff258e;
    letter-spacing: 2px;
}
.subtitle { color: #ffe22d; font-size: clamp(13px, 2.2vw, 18px); }

.menu-btn {
    min-width: 230px;
    padding: 11px 18px;
    border: 2px solid #a86cff;
    background: #35105ecc;
    color: white;
    border-radius: 12px;
    font-family: monospace;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
.menu-btn:hover { background: #5a1fa0; box-shadow: 0 0 14px #a86cff; }
.menu-btn.primary { background: #c2187bdd; border-color: #ff7fd0; }
.menu-btn.small { min-width: 0; font-size: 14px; padding: 7px 12px; }

.auth-form { display: flex; flex-direction: column; gap: 9px; align-items: center; }
.auth-form input {
    width: 230px;
    padding: 10px;
    border: 2px solid #a86cff;
    background: #120a33;
    color: white;
    border-radius: 10px;
    font-family: monospace;
    font-size: 16px;
}
.msg { min-height: 18px; color: #ff8bb5; font-size: 14px; }
.stats { color: #bfe9ff; font-size: 15px; line-height: 1.5; }
.row { display: flex; gap: 8px; }

.lb-list {
    list-style: none;
    min-width: 280px;
    max-height: 230px;
    overflow-y: auto;
    font-size: 17px;
    background: #120a33cc;
    border: 2px solid #a86cff;
    border-radius: 12px;
    padding: 8px 14px;
}
.lb-list li { display: flex; justify-content: space-between; gap: 20px; padding: 3px 0; }
.lb-list li.me { color: #ffe22d; font-weight: bold; }

.game-over-bar {
    position: absolute;
    left: 50%;
    bottom: 22%;
    transform: translateX(-50%);
}
</style>
</head>

<body>

<div class="game-wrap">
<canvas id="game" width="1024" height="432"></canvas>

<div class="controls">
    <button data-key="ArrowLeft">◀</button>
    <button data-key="ArrowUp">▲</button>
    <button data-key="ArrowDown">▼</button>
    <button data-key="ArrowRight">▶</button>
</div>

<!-- Main menu -->
<div id="menuScreen" class="overlay">
    <div class="title">SPACE OLYMPICS 🇮🇱</div>
    <div id="welcomeText" class="subtitle"></div>
    <div id="statsText" class="stats"></div>

    <div id="menuLoggedOut" class="auth-form">
        <button class="menu-btn primary" id="btnGuest" data-i18n="playGuest"></button>
        <button class="menu-btn" id="btnShowSignIn" data-i18n="signIn"></button>
        <button class="menu-btn" id="btnShowSignUp" data-i18n="signUp"></button>
        <button class="menu-btn small" id="btnLb1" data-i18n="leaderboard"></button>
    </div>

    <div id="menuLoggedIn" class="auth-form hidden">
        <button class="menu-btn primary" id="btnPlay" data-i18n="play"></button>
        <button class="menu-btn" id="btnLb2" data-i18n="leaderboard"></button>
        <button class="menu-btn" id="btnLogout" data-i18n="logout"></button>
    </div>
</div>

<!-- Leaderboard -->
<div id="lbScreen" class="overlay hidden">
    <div class="title" data-i18n="leaderboard"></div>
    <ol id="lbList" class="lb-list"></ol>
    <button class="menu-btn small" id="lbBack" data-i18n="back"></button>
</div>

<!-- Sign in / Sign up -->
<div id="authScreen" class="overlay hidden">
    <div class="title" id="authTitle"></div>
    <form id="authForm" class="auth-form" autocomplete="off">
        <input id="authUser" maxlength="16" data-i18n-ph="username">
        <input id="authPass" type="password" maxlength="64" data-i18n-ph="password">
        <input id="authPass2" type="password" maxlength="64" data-i18n-ph="confirmPassword">
        <div id="authMsg" class="msg"></div>
        <button class="menu-btn primary" type="submit" id="authSubmit"></button>
        <button class="menu-btn small" type="button" id="authBack" data-i18n="back"></button>
    </form>
</div>

<!-- Game over buttons -->
<div id="gameOverBar" class="game-over-bar row hidden">
    <button class="menu-btn small" id="btnAgain" data-i18n="again"></button>
    <button class="menu-btn small" id="btnMenu" data-i18n="mainMenu"></button>
</div>

<div class="lang-box">
    <span id="langStatus"></span>
    <select id="langSelect" aria-label="Language">
        <option value="en">🌐 English</option>
        <option value="he">עברית</option>
        <option value="ar">العربية</option>
        <option value="ru">Русский</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
    </select>
</div>
</div>

};

const RTL_LANGS = ["he", "ar"];
let lang = "en";
let T = STRINGS_EN;

function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

// Other languages come from the free MyMemory translation API (no key needed)
async function translateViaApi(target) {
    const cached = safeGet("so_lang_v4_" + target);
    if (cached) { try { return JSON.parse(cached); } catch(e){} }

    const keysList = Object.keys(STRINGS_EN);
    const results = await Promise.all(keysList.map(async k => {
        const source = k === "points" ? "points" : STRINGS_EN[k];
        const url = "https://api.mymemory.translated.net/get?q=" +
            encodeURIComponent(source) + "&langpair=en|" + target;
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const text = data && data.responseData && data.responseData.translatedText;
        if (!text || data.responseStatus !== 200) throw new Error("bad response");
        return [k, text];
    }));

    const out = Object.fromEntries(results);
    out.points = "+10 " + out.points;
    safeSet("so_lang_v4_" + target, JSON.stringify(out));
    return out;
}

const langSelect = document.getElementById("langSelect");
const langStatus = document.getElementById("langStatus");

async function setLanguage(code) {
    langSelect.value = code;
    safeSet("so_lang", code);

    if (BUILTIN[code]) {
        lang = code; T = BUILTIN[code];
        langStatus.textContent = "";
        applyMenuText();
        return;
    }

    langStatus.textContent = "…";
    try {
        const strings = await translateViaApi(code);
        if (langSelect.value !== code) return; // user switched again meanwhile
        lang = code; T = strings;
        langStatus.textContent = "";
        applyMenuText();
    } catch (err) {
        console.warn("Translation failed:", err);
        lang = "en"; T = STRINGS_EN;
        langSelect.value = "en";
        applyMenuText();
        langStatus.textContent = "⚠ offline";
        setTimeout(() => langStatus.textContent = "", 2500);
    }
}

langSelect.addEventListener("change", () => { setLanguage(langSelect.value); langSelect.blur(); });

// Draw text with correct direction for Hebrew/Arabic; maxW stops long translations overflowing
function text(str, x, y, maxW) {
    ctx.direction = RTL_LANGS.includes(lang) ? "rtl" : "ltr";
    if (maxW) ctx.fillText(str, x, y, maxW);
    else ctx.fillText(str, x, y);
    ctx.direction = "ltr";
}

function polygon(points, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for(let i=1;i<points.length;i++)
        ctx.lineTo(points[i][0],points[i][1]);
    ctx.closePath();
    ctx.fill();
}

function rect(x,y,w,h,color) {
    ctx.fillStyle=color;
    ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function glow(x,y,r,color) {
    ctx.save();
    ctx.shadowBlur=r;
    ctx.shadowColor=color;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(x,y,r/4,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
}

// Stars
function createStars() {
    stars=[];
    for(let i=0;i<130;i++){
        stars.push({
            x:rand(0,W),
            y:rand(0,H),
            size:rand(1,3),
            speed:rand(.15,1),
            phase:rand(0,7)
        });
    }
}

// Player
function createPlayer() {
    return {
        x:450,
        y:330,
        w:60,
        h:75,
        speed:4,
        tilt:0
    };
}

function resetGame() {
    score=0;
    lives=3;
    coins=currentSave().coins;
    newBest=false;
    level=2;
    progress=0;
    gameOver=false;
    shake=0;
    invincible=0;

    player=createPlayer();
    crystals=[];
    enemies=[];
    particles=[];
    comets=[];
    bullets=[];
    floaters=[];
    shootCooldown=0;

    for(let i=0;i<5;i++) spawnCrystal();
    for(let i=0;i<3;i++) spawnEnemy();
}

function spawnCrystal() {
    crystals.push({
        x:rand(40,W-40),
        y:rand(55,300),
        size:25,
        phase:rand(0,10),
        speed:rand(1.5,2.5)
    });
}

function farSpot() {
    // a spot not too close to the player, so aliens never spawn on top of you
    for(let i=0;i<20;i++){
        const p={x:rand(50,W-50),y:rand(70,300)};
        if(!player || Math.hypot(p.x-(player.x+30),p.y-(player.y+30))>280) return p;
    }
    return {x:player.x>W/2?60:W-60,y:80};
}

function spawnEnemy() {
    const p=farSpot();
    enemies.push({
        x:p.x,
        y:p.y,
        type:Math.floor(rand(0,3)),
        phase:rand(0,10),
        speed:rand(.4,1.1),
        size:55
    });
}

// ===== Cloud saves (Firebase) =====
// Paste your Firebase web config here. While apiKey is empty, accounts are saved
// only in this browser (local mode), so the game still works.
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCa8-11IkL7dMkLVLOiMBkiR8rnoiCrU9E",
    authDomain: "space-olympics.firebaseapp.com",
    projectId: "space-olympics",
    storageBucket: "space-olympics.firebasestorage.app",
    messagingSenderId: "681680611118",
    appId: "1:681680611118:web:b2b1c5b4216c089927fcbf"
};
const CLOUD = !!FIREBASE_CONFIG.apiKey;
const EMAIL_DOMAIN = "@spaceolympics.game"; // fake email made from the username, never shown

let fb = null;          // { auth, db, A (auth functions), F (firestore functions) }
let cloudUser = null;   // { uid, name, save }
let cloudReady = !CLOUD;

async function initCloud() {
    // firebase.js is Firebase bundled into this repo (school networks may block Google's CDN)
    const M = await import("./firebase.js");
    const A = M, F = M;
    const app = M.initializeApp(FIREBASE_CONFIG);
    fb = { auth: A.getAuth(app), db: F.getFirestore(app), A, F };

    A.onAuthStateChanged(fb.auth, async user => {
        if (user) {
            if (!cloudUser || cloudUser.uid !== user.uid) {
                try { cloudUser = await loadCloudUser(user); }
                catch (e) { console.warn(e); cloudUser = { uid: user.uid, name: user.email.split("@")[0], save: emptySave() }; }
            }
            session = cloudUser.name;
        } else {
            cloudUser = null;
            if (session !== "guest") session = null;
        }
        cloudReady = true;
        if (state === "menu") showMenu();
    });
}

async function loadCloudUser(user) {
    const snap = await fb.F.getDoc(fb.F.doc(fb.db, "users", user.uid));
    const d = snap.exists() ? snap.data() : {};
    return {
        uid: user.uid,
        name: d.name || user.email.split("@")[0],
        save: Object.assign(emptySave(), { best: d.best || 0, coins: d.coins || 0, games: d.games || 0 })
    };
}

function cloudError(e) {
    const c = (e && e.code) || "";
    if (c.includes("email-already-in-use")) return T.errTaken;
    if (c.includes("weak-password")) return T.errPass;
    if (c.includes("invalid-credential") || c.includes("wrong-password") ||
        c.includes("user-not-found") || c.includes("invalid-email")) return T.errWrong;
    console.warn(e);
    return T.errNet;
}

// ===== Accounts & saves =====
const emptySave = () => ({ best: 0, coins: 0, games: 0 });
let session = null; // null = nobody, "guest", or a username

function loadUsers() {
    try { return JSON.parse(safeGet("so_users")) || {}; } catch(e) { return {}; }
}
function saveUsers(u) { safeSet("so_users", JSON.stringify(u)); }

function currentSave() {
    if (session === "guest") {
        try { return Object.assign(emptySave(), JSON.parse(safeGet("so_guest_save"))); }
        catch(e) { return emptySave(); }
    }
    if (CLOUD) return cloudUser ? Object.assign({}, cloudUser.save) : emptySave();
    const u = session && loadUsers()[session.toLowerCase()];
    return u ? Object.assign(emptySave(), u.save) : emptySave();
}

function writeSave(data) {
    if (session === "guest") { safeSet("so_guest_save", JSON.stringify(data)); return; }
    if (CLOUD) {
        if (!cloudUser) return;
        cloudUser.save = data;
        fb.F.setDoc(fb.F.doc(fb.db, "users", cloudUser.uid), { name: cloudUser.name, ...data })
            .catch(e => console.warn("Cloud save failed:", e));
        return;
    }
    const users = loadUsers();
    const u = session && users[session.toLowerCase()];
    if (!u) return;
    u.save = data;
    saveUsers(users);
}

function displayName() {
    if (session === "guest") return T.guest;
    if (CLOUD) return cloudUser ? cloudUser.name : "";
    const u = loadUsers()[(session || "").toLowerCase()];
    return u ? u.name : "";
}

function randomSalt() {
    const a = new Uint8Array(16);
    crypto.getRandomValues(a);
    return Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
}

// Local mode: passwords are kept only as a salted SHA-256 hash
async function hashPassword(password, salt) {
    const data = new TextEncoder().encode(salt + ":" + password);
    const buf = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
}

async function signUp(name, pass, pass2) {
    if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) return T.errUser;
    if (pass.length < 6) return T.errPass;
    if (pass !== pass2) return T.errMatch;

    if (CLOUD) {
        if (!fb) return T.errNet;
        try {
            const cred = await fb.A.createUserWithEmailAndPassword(fb.auth, name.toLowerCase() + EMAIL_DOMAIN, pass);
            cloudUser = { uid: cred.user.uid, name, save: emptySave() };
            await fb.F.setDoc(fb.F.doc(fb.db, "users", cred.user.uid), { name, ...emptySave() });
            login(name);
            return null;
        } catch (e) { return cloudError(e); }
    }

    const users = loadUsers();
    const key = name.toLowerCase();
    if (users[key]) return T.errTaken;
    const salt = randomSalt();
    users[key] = { name, salt, hash: await hashPassword(pass, salt), save: emptySave() };
    saveUsers(users);
    login(name);
    return null;
}

async function signIn(name, pass) {
    if (CLOUD) {
        if (!fb) return T.errNet;
        try {
            const cred = await fb.A.signInWithEmailAndPassword(fb.auth, name.toLowerCase() + EMAIL_DOMAIN, pass);
            cloudUser = await loadCloudUser(cred.user);
            login(cloudUser.name);
            return null;
        } catch (e) { return cloudError(e); }
    }
    const u = loadUsers()[name.toLowerCase()];
    if (!u || (await hashPassword(pass, u.salt)) !== u.hash) return T.errWrong;
    login(u.name);
    return null;
}

function login(name) {
    session = name;
    safeSet("so_session", name === "guest" || !CLOUD ? name : "");
    showMenu();
}

function logout() {
    if (CLOUD && cloudUser && session !== "guest") {
        cloudUser = null;
        fb.A.signOut(fb.auth).catch(()=>{});
    }
    session = null;
    safeSet("so_session", "");
    showMenu();
}

// Called once when a run ends
function recordGameOver() {
    const save = currentSave();
    save.games++;
    save.coins = coins;
    if (score > save.best) { save.best = score; newBest = score > 0; }
    writeSave(save);
    if (newBest && CLOUD && cloudUser && session !== "guest") {
        fb.F.setDoc(fb.F.doc(fb.db, "leaderboard", cloudUser.uid), { name: cloudUser.name, best: save.best })
            .catch(e => console.warn("Leaderboard save failed:", e));
    }
}

// Top 10 scores: from Firebase when online, otherwise accounts on this browser
async function fetchLeaderboard() {
    if (CLOUD && fb) {
        const q = fb.F.query(fb.F.collection(fb.db, "leaderboard"), fb.F.orderBy("best", "desc"), fb.F.limit(10));
        const snap = await fb.F.getDocs(q);
        return snap.docs.map(d => d.data());
    }
    return Object.values(loadUsers())
        .map(u => ({ name: u.name, best: (u.save && u.save.best) || 0 }))
        .filter(r => r.best > 0)
        .sort((a, b) => b.best - a.best)
        .slice(0, 10);
}

const $ = id => document.getElementById(id);
const menuScreen = $("menuScreen"), authScreen = $("authScreen");
const gameOverBar = $("gameOverBar"), controlsEl = document.querySelector(".controls");
let authMode = "signin";

function applyMenuText() {
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T[el.dataset.i18n]);
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = T[el.dataset.i18nPh]);
    const rtl = RTL_LANGS.includes(lang) ? "rtl" : "ltr";
    menuScreen.dir = authScreen.dir = rtl;
    $("authTitle").textContent = authMode === "signin" ? T.signIn : T.signUp;
    $("authSubmit").textContent = authMode === "signin" ? T.signIn : T.signUp;
    if (state === "menu") showMenu();
}

function showMenu() {
    state = "menu";
    menuScreen.classList.remove("hidden");
    authScreen.classList.add("hidden");
    gameOverBar.classList.add("hidden");
    controlsEl.classList.add("hidden");

    const loggedIn = !!session;
    if (!cloudReady && !loggedIn) {
        $("menuLoggedOut").classList.add("hidden");
        $("menuLoggedIn").classList.add("hidden");
        $("welcomeText").textContent = T.loading;
        $("statsText").textContent = "";
        return;
    }
    $("menuLoggedOut").classList.toggle("hidden", loggedIn);
    $("menuLoggedIn").classList.toggle("hidden", !loggedIn);

    if (loggedIn) {
        const s = currentSave();
        $("welcomeText").textContent = T.welcome + ", " + displayName() + "!";
        $("statsText").textContent = T.bestScore + ": " + s.best + " · " +
            T.gamesPlayed + ": " + s.games + " · 🪙 " + s.coins;
        $("btnLogout").textContent = session === "guest" ? T.back : T.logout;
    } else {
        $("welcomeText").textContent = "";
        $("statsText").textContent = "";
    }
}

function showAuth(mode) {
    authMode = mode;
    state = "auth";
    menuScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
    $("authPass2").classList.toggle("hidden", mode !== "signup");
    $("authMsg").textContent = "";
    $("authPass").value = $("authPass2").value = "";
    applyMenuText();
    $("authUser").focus();
}

function startGame() {
    state = "playing";
    menuScreen.classList.add("hidden");
    authScreen.classList.add("hidden");
    gameOverBar.classList.add("hidden");
    controlsEl.classList.remove("hidden");
    resetGame();
    startFrame = frame;
    releaseAll();
    if (document.activeElement) document.activeElement.blur();
}

async function showLeaderboard() {
    state = "lb";
    menuScreen.classList.add("hidden");
    $("lbScreen").classList.remove("hidden");
    $("lbScreen").dir = RTL_LANGS.includes(lang) ? "rtl" : "ltr";
    const list = $("lbList");
    list.innerHTML = "<li>" + T.loading + "</li>";
    try {
        const rows = await fetchLeaderboard();
        list.innerHTML = "";
        if (!rows.length) list.innerHTML = "<li>" + T.noScores + "</li>";
        rows.forEach((r, i) => {
            const li = document.createElement("li");
            if (r.name === displayName()) li.className = "me";
            const a = document.createElement("span"); a.textContent = (i + 1) + ". " + r.name;
            const b = document.createElement("span"); b.textContent = r.best;
            li.append(a, b);
            list.appendChild(li);
        });
    } catch (e) {
        console.warn(e);
        list.innerHTML = "<li>" + T.errNet + "</li>";
    }
}
$("btnLb1").onclick = showLeaderboard;
$("btnLb2").onclick = showLeaderboard;
$("lbBack").onclick = () => { $("lbScreen").classList.add("hidden"); showMenu(); };

$("btnGuest").onclick = () => { login("guest"); startGame(); };
$("btnPlay").onclick = startGame;
$("btnLogout").onclick = logout;
$("btnShowSignIn").onclick = () => showAuth("signin");
$("btnShowSignUp").onclick = () => showAuth("signup");
$("authBack").onclick = showMenu;
$("btnAgain").onclick = startGame;
$("btnMenu").onclick = showMenu;

$("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("authUser").value.trim(), pass = $("authPass").value;
    const err = authMode === "signup"
        ? await signUp(name, pass, $("authPass2").value)
        : await signIn(name, pass);
    if (err) $("authMsg").textContent = err;
});

// Keyboard
// Use physical key codes so WASD/R/M/Space work on a Hebrew keyboard layout too
const CODE_MAP={KeyW:"w",KeyA:"a",KeyS:"s",KeyD:"d",KeyR:"r",KeyM:"m",Space:" ",
    ArrowUp:"arrowup",ArrowDown:"arrowdown",ArrowLeft:"arrowleft",ArrowRight:"arrowright"};
const keyName=e=>CODE_MAP[e.code]||e.key.toLowerCase();

document.addEventListener("keydown",e=>{
    if(state!=="playing") return; // let menu inputs get normal typing
    const k=keyName(e);
    // stop Space/arrows from pressing a focused button, opening the language menu or scrolling
    if(k in {" ":1,arrowup:1,arrowdown:1,arrowleft:1,arrowright:1}){
        e.preventDefault();
        if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur();
    }
    keys[k]=true;

    if(gameOver && k==="r") startGame();
    if(gameOver && k==="m") showMenu();
    if(e.key==="Escape"){ if(!gameOver){ gameOver=true; recordGameOver(); } showMenu(); }
});

document.addEventListener("keyup",e=>{
    keys[keyName(e)]=false;
});

// If the window loses focus (right-click menu, alt-tab), release every key so none get stuck
function releaseAll(){ for(const k in keys) keys[k]=false; mouse.down=false; }
window.addEventListener("blur",releaseAll);
document.addEventListener("visibilitychange",releaseAll);

// No right-click menu inside the game; right-click shoots like left-click
document.querySelector(".game-wrap").addEventListener("contextmenu",e=>e.preventDefault());

// Mobile controls
document.querySelectorAll(".controls button").forEach(btn=>{
    const key=btn.dataset.key.toLowerCase();

    btn.addEventListener("pointerdown",e=>{
        e.preventDefault();
        keys[key]=true;
        btn.setPointerCapture(e.pointerId);
    });

    const release=()=>{
        keys[key]=false;
    };

    btn.addEventListener("pointerup",release);
    btn.addEventListener("pointercancel",release);
    btn.addEventListener("lostpointercapture",release);
});

// Tap / click the game to restart after game over
function toCanvas(e){
    const r=canvas.getBoundingClientRect();
    return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height };
}
canvas.addEventListener("pointermove",e=>{ Object.assign(mouse,toCanvas(e)); });
canvas.addEventListener("pointerdown",e=>{
    if(state!=="playing") return;
    if(gameOver){ startGame(); return; }
    Object.assign(mouse,toCanvas(e));
    mouse.down=true;
    canvas.setPointerCapture(e.pointerId);
});
const stopShoot=()=>{ mouse.down=false; };
canvas.addEventListener("pointerup",stopShoot);
canvas.addEventListener("pointercancel",stopShoot);

function shoot(){
    const sx=player.x+30, sy=player.y-8;
    const a=Math.atan2(mouse.y-sy, mouse.x-sx);
    bullets.push({x:sx,y:sy,vx:Math.cos(a)*11,vy:Math.sin(a)*11,life:90});
    shootCooldown=9;
}

function distance(a,b) {
    return Math.hypot(a.x-b.x,a.y-b.y);
}

// Particle explosion
function explosion(x,y,color,count=18) {
    for(let i=0;i<count;i++){
        let angle=rand(0,Math.PI*2);
        let speed=rand(1,5);

        particles.push({
            x,y,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,
            life:rand(15,35),
            color,
            size:rand(2,5)
        });
    }
}

// Background
function drawBackground() {
    let gradient=ctx.createLinearGradient(0,0,0,H);
    gradient.addColorStop(0,"#100b35");
    gradient.addColorStop(.55,"#421077");
    gradient.addColorStop(1,"#721a91");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    // Galaxy clouds
    for(let i=0;i<5;i++){
        ctx.fillStyle="rgba(119,38,194,.07)";
        ctx.beginPath();
        ctx.arc(
            100+i*230+Math.sin(frame*.006+i)*30,
            170+Math.cos(frame*.008+i)*50,
            100+i*8,0,Math.PI*2
        );
        ctx.fill();
    }

    // Stars
    stars.forEach(s=>{
        let brightness=.4+Math.sin(frame*.06+s.phase)*.5;

        ctx.globalAlpha=brightness;
        rect(s.x,s.y,s.size,s.size,"#ffffff");

        if(frame%3===0) s.x-=s.speed;

        if(s.x<0){
            s.x=W;
            s.y=rand(0,H);
        }
    });

    ctx.globalAlpha=1;

    // Distant shooting stars
    if(Math.random()<.012){
        comets.push({
            x:W,
            y:rand(20,260),
            life:40
        });
    }

    comets.forEach(c=>{
        ctx.strokeStyle="#8ceaff";
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(c.x,c.y);
        ctx.lineTo(c.x+20,c.y-8);
        ctx.stroke();

        c.x-=7;
        c.life--;
    });

    comets=comets.filter(c=>c.life>0);

    // Purple sparkling stars
    drawSparkle(720,125,16,"#d64dff");
    drawSparkle(965,195,17,"#ff315d");
    drawSparkle(954,312,20,"#00cfff");
    drawSparkle(643,373,15,"#ffe32d");
    drawSparkle(265,347,18,"#ff8b60");

    // Alien planet ground
    polygon([
        [0,432],[0,425],[12,428],[25,421],[39,428],
        [55,427],[70,434],[88,425],[105,431],
        [125,422],[140,428],[157,419],[177,430],
        [197,426],[215,434],[240,426],[260,431],
        [280,424],[300,431],[320,426],[345,432],
        [365,423],[380,431],[400,426],[420,433],
        [440,423],[460,430],[480,426],[500,433],
        [520,426],[540,432],[560,420],[580,430],
        [600,426],[620,435],[640,422],[660,430],
        [680,424],[700,432],[720,420],[740,430],
        [760,425],[780,434],[800,420],[820,430],
        [840,424],[860,431],[880,421],[900,430],
        [920,423],[940,431],[960,419],[980,429],
        [1000,418],[1024,428],[1024,432]
    ],"#d66b52");

    rect(0,431,W,2,"#ffad6d");
}

function drawSparkle(x,y,size,color) {
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle=color;
    polygon([
        [0,-size],[size*.35,-size*.35],
        [size,0],[size*.35,size*.35],
        [0,size],[-size*.35,size*.35],
        [-size,0],[-size*.35,-size*.35]
    ],color);
    ctx.restore();
}

// Hearts
function drawHeart(x,y,size,color) {
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(size/30,size/30);

    polygon([
        [-14,-5],[-14,-12],[-7,-17],
        [0,-10],[7,-17],[14,-12],
        [14,-5],[0,12]
    ],color);

    ctx.restore();
}

function drawHUD() {
    // Hearts
    for(let i=0;i<3;i++){
        let active=i<lives;
        let pulse=active?Math.sin(frame*.1+i)*1.5:0;

        drawHeart(50+i*70,40+pulse,48,
            active?"#ff398b":"#642b70");

    // Level
    ctx.fillStyle="white";
    ctx.font="bold 30px monospace";

    text(T.level+" "+level,362,50,98);

    rect(474,35,Math.max(0,progress/100*169),9,"#00d8ff");
    rect(474,35,progress/100*169,3,"#9bfaff");

    // Coins
    ctx.fillStyle="#fff000";
    ctx.font="bold 27px monospace";
    ctx.textAlign="left";
    ctx.fillText(coins,907,49);

    ctx.fillStyle="#ffd000";
    ctx.beginPath();
    ctx.arc(985,39,13,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fff27b";
    ctx.fillRect(981,30,5,17);
    ctx.fillRect(978,35,12,5);
}

// Animated aliens
function drawAlien(e) {
    let x=e.x;
    let y=e.y+Math.sin(frame*.06+e.phase)*7;
    let bob=Math.sin(frame*.12+e.phase)*3;

    let color=["#00cfff","#9ee600","#ff456e"][e.type];

    ctx.save();

    // Tentacles for green alien
    if(e.type===1){
        for(let i=0;i<5;i++){
            let tx=x-18+i*9;
            let wave=Math.sin(frame*.13+i+e.phase)*5;

            ctx.strokeStyle="#a1e900";
            ctx.lineWidth=4;
            ctx.beginPath();
            ctx.moveTo(tx,y+25);
            ctx.lineTo(tx+wave,y+38+Math.sin(frame*.1+i)*5);
            ctx.stroke();
        }
    }

    // Shadow
    ctx.fillStyle="rgba(0,0,0,.25)";
    ctx.beginPath();
    ctx.ellipse(x,y+34,30,7,0,0,Math.PI*2);
    ctx.fill();

    // UFO shell
    ctx.fillStyle="#aaa3d5";
    ctx.beginPath();
    ctx.ellipse(x,y+16,34,19,0,0,Math.PI*2);
    ctx.fill();

    // Dome
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(x,y+1+bob,26,Math.PI,Math.PI*2);
    ctx.lineTo(x+25,y+13);
    ctx.lineTo(x-25,y+13);
    ctx.closePath();
    ctx.fill();

    // Dome highlights
    rect(x-18,y-13+bob,8,4,"#e7f6ff");
    rect(x+10,y-16+bob,7,4,"#e7f6ff");

    // Big eye
    ctx.fillStyle="#ffffff";
    ctx.beginPath();
    ctx.ellipse(x,y+2+bob,12,13,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#10225c";
    ctx.beginPath();
    ctx.arc(x,y+3+bob,6,0,Math.PI*2);
    ctx.fill();

    rect(x-3,y+bob,4,4,"#ffffff");

    // UFO bottom
    rect(x-23,y+17,46,5,"#a8a1ce");

    for(let i=0;i<4;i++){
        glow(x-17+i*11,y+23,8,color);
    }

    ctx.restore();
}

// Crystal
function drawCrystal(c) {
    let y=c.y+Math.sin(frame*.09+c.phase)*7;
    let rotation=Math.sin(frame*.06+c.phase)*3;

    ctx.save();
    ctx.translate(c.x,y);
    ctx.rotate(rotation*.03);

    ctx.shadowBlur=18;
    ctx.shadowColor="#c18aff";

    polygon([
        [0,-23],[20,-4],[12,16],
        [0,25],[-13,15],[-20,-4]
    ],"#9b83da");

    polygon([
        [0,-23],[0,18],[-13,15],[-20,-4]
    ],"#d8c5ff");

    polygon([
        [0,-23],[20,-4],[12,16],[0,18]
    ],"#8c6bc5");

    polygon([
        [0,-13],[9,-3],[0,8],[-9,-3]
    ],"#eee5ff");

    ctx.restore();
}

// Collectible particles
function updateParticles() {
    particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=.04;
        p.life--;

        ctx.globalAlpha=Math.max(0,p.life/35);
        rect(p.x,p.y,p.size,p.size,p.color);
    });

    ctx.globalAlpha=1;
    particles=particles.filter(p=>p.life>0);
}

// Collision
function update() {
    frame++;

    if(state!=="playing" || gameOver) return;

    // Player movement
    let dx=0,dy=0;

    if(keys["arrowleft"]||keys["a"]) dx--;
    if(keys["arrowright"]||keys["d"]) dx++;
    if(keys["arrowup"]||keys["w"]) dy--;
    if(keys["arrowdown"]||keys["s"]) dy++;

    if(dx||dy){
        const len=Math.hypot(dx,dy);
        player.x+=dx/len*player.speed;
        player.y+=dy/len*player.speed;
    }

    // ship art spans x-10..x+75 and y-12..y+68
    player.x=Math.max(10,Math.min(W-76,player.x));
    player.y=Math.max(14,Math.min(H-74,player.y));

    // Shooting
    if(shootCooldown>0) shootCooldown--;
    if((mouse.down||keys[" "]) && shootCooldown===0) shoot();

    bullets.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.life--; });
    bullets=bullets.filter(b=>b.life>0 && b.x>-20 && b.x<W+20 && b.y>-20 && b.y<H+20);

    floaters.forEach(f=>{ f.y-=.8; f.life--; });
    floaters=floaters.filter(f=>f.life>0);

    if(invincible>0) invincible--;

    // Crystals
    crystals.forEach((c,i)=>{
        c.x-=c.speed;

        if(distance(
            {x:player.x+30,y:player.y+30},
            {x:c.x,y:c.y}
        )<34){
            score+=10;
            coins++;
            progress+=10;

            if(progress>=100){
                progress=0;
                level++;
            }

            explosion(c.x,c.y,"#d9a2ff",20);
            floaters.push({x:c.x,y:c.y,text:T.points,color:"#ffffff",life:45});
            crystals.splice(i,1);
            crystals.push({
                x:W+rand(30,250),
                y:rand(60,310),
                size:25,
                phase:rand(0,10),
                speed:rand(1.5,2.5)
            });
        }
        else if(c.x<-30){
            c.x=W+rand(30,200);
            c.y=rand(60,310);
        }
    });

    // Enemies
    const chase=Math.min(2.6, .55+level*.12);   // aliens get faster every level
    enemies.forEach((e,i)=>{
        // steer toward the player, with a little wobble so they don't stack
        const tx=player.x+30-e.x, ty=player.y+30-e.y;
        const d=Math.hypot(tx,ty)||1;
        const sp=chase*(.7+e.speed*.4);
        e.x+=tx/d*sp+Math.sin(frame*.03+e.phase)*.6;
        e.y+=ty/d*sp+Math.cos(frame*.035+e.phase)*.6;

        // hit by a bullet?
        for(const b of bullets){
            if(b.life>0 && Math.hypot(b.x-e.x,b.y-(e.y+5))<32){
                b.life=0;
                score+=25;
                coins+=2;
                explosion(e.x,e.y,["#00cfff","#9ee600","#ff456e"][e.type],26);
                floaters.push({x:e.x,y:e.y,text:"+25",color:"#ffe22d",life:45});
                const p=farSpot(); e.x=p.x; e.y=p.y;
                break;
            }
        }

        if(distance(
            {x:player.x+30,y:player.y+30},
            {x:e.x,y:e.y}
        )<44 && invincible===0){

            lives--;
            invincible=100;
            shake=12;

            explosion(player.x+30,player.y+30,"#ff398b",30);

            const p=farSpot(); e.x=p.x; e.y=p.y;

            if(lives<=0){
                gameOver=true;
                recordGameOver();
                gameOverBar.classList.remove("hidden");
            }
        }
    });

    // Occasionally spawn more enemies
    if(frame%600===0 && enemies.length<Math.min(10,3+level)){
        spawnEnemy();
    }

    if(shake>0) shake*=.8;
}

// Game drawing
function draw() {
    ctx.save();

    if(shake>1){
        ctx.translate(rand(-shake,shake),rand(-shake,shake));
    }

    drawBackground();

    if(state!=="playing"){
        ctx.restore();
        return;
    }

    crystals.forEach(drawCrystal);
    enemies.forEach(drawAlien);

    drawPlayer();

    updateParticles();

    // Bullets
    bullets.forEach(b=>{
        glow(b.x,b.y,14,"#7dfcff");
        rect(b.x-2,b.y-2,5,5,"#ffffff");
    });

    // Floating "+points" texts
    ctx.textAlign="center";
    ctx.font="bold 20px monospace";
    floaters.forEach(f=>{
        ctx.globalAlpha=Math.min(1,f.life/20);
        ctx.fillStyle=f.color;
        text(f.text,f.x,f.y,160);
    });
    ctx.globalAlpha=1;
    ctx.textAlign="left";

    // Crosshair
    if(!gameOver){
        ctx.strokeStyle="#7dfcff";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.arc(mouse.x,mouse.y,10,0,Math.PI*2);
        ctx.moveTo(mouse.x-16,mouse.y); ctx.lineTo(mouse.x-6,mouse.y);
        ctx.moveTo(mouse.x+6,mouse.y);  ctx.lineTo(mouse.x+16,mouse.y);
        ctx.moveTo(mouse.x,mouse.y-16); ctx.lineTo(mouse.x,mouse.y-6);
        ctx.moveTo(mouse.x,mouse.y+6);  ctx.lineTo(mouse.x,mouse.y+16);
        ctx.stroke();
    }

    // Hint for the first few seconds
    if(frame-startFrame<240 && !gameOver){
        ctx.globalAlpha=Math.min(1,(240-(frame-startFrame))/60);
        ctx.fillStyle="#ffe22d";
        ctx.font="bold 18px monospace";
        ctx.textAlign="center";
        text(T.aimHint,W/2,H-22,W-340);
        ctx.textAlign="left";
        ctx.globalAlpha=1;
    }

    drawHUD();

    // Score display
    ctx.fillStyle="#ffffff";
    ctx.font="bold 17px monospace";
    ctx.textAlign="left";
    text(T.score+" "+score,18,105,300);

    // Game over
    if(gameOver){
        ctx.fillStyle="rgba(9,3,30,.85)";
        ctx.fillRect(0,0,W,H);

        ctx.textAlign="center";

        ctx.shadowBlur=20;
        ctx.shadowColor="#ff258e";

        ctx.fillStyle="#ff60bc";
        ctx.font="bold 58px monospace";
        text(T.gameOver,W/2,175,W-80);

        ctx.shadowBlur=0;
        ctx.fillStyle="white";
        ctx.font="bold 25px monospace";
        text(T.finalScore+" "+score,W/2,230,W-80);

        if(newBest){
            ctx.fillStyle="#00e5ff";
            ctx.font="bold 22px monospace";
            text(T.newBest,W/2,258,W-80);
        }

        ctx.fillStyle="#ffe22d";
        ctx.font="bold 20px monospace";
        text(T.playAgain,W/2,290,W-80);

        ctx.textAlign="left";
    }

    ctx.restore();
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

createStars();
session = safeGet("so_session") || null;
if (session && session !== "guest" && (CLOUD || !loadUsers()[session.toLowerCase()])) session = null;
if (CLOUD) initCloud().catch(e => { console.warn("Firebase failed to load:", e); cloudReady = true; showMenu(); });
setLanguage(safeGet("so_lang") || "en");
resetGame();
showMenu();
gameLoop();

</script>
</body>
